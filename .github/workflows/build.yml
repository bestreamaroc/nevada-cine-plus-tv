name: Build Nevada Cine Plus TV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build Debug APK
        run: |
          echo "ksp.incremental=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" >> gradle.properties
          gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload NEVADA CINE PLUS APK
        uses: actions/upload-artifact@v4
        with:
          name: NEVADA-CINE-PLUS-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
